<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Withdrawal_type')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-withdrawal_type"  readonly class="form-control" type="text"
                value="{$row.withdrawal_type_text|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Amount')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-amount" data-rule="required" readonly class="form-control" step="0.01" type="number"
                value="{$row.amount|htmlentities}">
        </div>
    </div>
    <!-- <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Fee')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-fee" data-rule="required" readonly class="form-control" step="0.01" type="number"
                value="{$row.fee|htmlentities}">
        </div>
    </div> -->
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Actual_amount')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-actual_amount" data-rule="required" readonly class="form-control" step="0.01" type="number"
                value="{$row.actual_amount|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Withdrawal_method')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-withdrawal_method" data-rule="required" class="form-control" readonly type="text"
                value="{$row.withdrawal_method_text|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Created_at')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-created_at" data-rule="required" class="form-control datetimepicker" readonly
                data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="true" name="row[created_at]" type="text"
                value="{:$row.created_at?datetime($row.created_at):''}">
        </div>
    </div>

    {volist name="form_data" id="item"}
    <div class="form-group">
        <label for="field_{$item.label|md5}" class="control-label col-xs-12 col-sm-2">{$item.label}:</label>
        <div class="col-xs-12 col-sm-8">
            <p class="form-control-static">{$item.value|htmlentities}</p>
        </div>
    </div>
    {/volist}

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">

            <div class="radio">
                {foreach name="statusList" item="vo"}
                <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio"
                        value="{$key}" {in name="key" value="$row.status" }checked{/in} /> {$vo}</label>
                {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Reason')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-description" class="form-control " rows="5" name="row[reason]" cols="100">{$row.reason|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">付款凭证编号:</label>
        <div class="col-xs-12 col-sm-8"><input class="form-control" name="row[payment_reference]" maxlength="200" value="{$row.payment_reference|htmlentities}" placeholder="人工付款完成后填写银行回单或流水编号">
        <p class="help-block">选择“已付款”必须填写；此操作记录付款结果，不会自动打款。已处理申请不可再次修改。</p></div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
