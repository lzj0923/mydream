spring:
  application:
    name: mydream-cms
  datasource:
    url: ${CMS_DATABASE_URL:jdbc:mysql://localhost:3306/mydream_cms?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${CMS_DATABASE_USERNAME:mydream}
    password: ${CMS_DATABASE_PASSWORD:mydream}
    hikari:
      maximum-pool-size: ${CMS_DATABASE_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: ${CMS_MAX_FILE_SIZE:500MB}
      max-request-size: ${CMS_MAX_FILE_SIZE:500MB}
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${CMS_MAIL_HOST:}
    port: ${CMS_MAIL_PORT:587}
    username: ${CMS_MAIL_USERNAME:}
    password: ${CMS_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${CMS_MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${CMS_MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: ${CMS_MAIL_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${CMS_MAIL_TIMEOUT:10000}
      mail.smtp.writetimeout: ${CMS_MAIL_WRITE_TIMEOUT:10000}

server:
  port: ${CMS_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${CMS_SECURE_COOKIES:false}
  forward-headers-strategy: framework

management:
  health:
    mail:
      enabled: ${CMS_MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

cms:
  public-base-url: ${CMS_PUBLIC_BASE_URL:http://localhost:8080}
  upload-directory: ${CMS_UPLOAD_DIRECTORY:./data/uploads}
  allowed-origins: ${CMS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap-admin-email: ${CMS_BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-password: ${CMS_BOOTSTRAP_ADMIN_PASSWORD:}
  pii-key-base64: ${CMS_PII_KEY_BASE64:}
  preview-secret: ${CMS_PREVIEW_SECRET:}
  legacy-asset-directory: ${CMS_LEGACY_ASSET_DIRECTORY:../public}
  legacy-asset-site-key: ${CMS_LEGACY_ASSET_SITE_KEY:mydream}
  mail-from: ${CMS_MAIL_FROM:}
  app-content:
    enabled: ${CMS_APP_CONTENT_ENABLED:false}
    write-enabled: ${CMS_APP_CONTENT_WRITE_ENABLED:false}
    database-url: ${CMS_APP_DATABASE_URL:}
    username: ${CMS_APP_DATABASE_USERNAME:}
    password: ${CMS_APP_DATABASE_PASSWORD:}
    public-base-url: ${CMS_APP_PUBLIC_BASE_URL:}

logging:
  level:
    org.springframework.security: INFO
